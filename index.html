<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="SüperAraç — kişisel araç özellikleri, yakıt, masraf ve bakım takibi" />
  <meta name="application-name" content="SüperAraç" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="theme-color" content="#f4f6f7" />
  <title>SüperAraç</title>
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="manifest" href="site.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="phone">
    <header class="app-header">
      <a class="brand" href="#/" data-nav>SüperAraç</a>
      <div class="obd-pill" data-obd aria-live="polite">
        <span class="obd-dot" aria-hidden="true"></span>
        <span>OBD Bağlı değil</span>
      </div>
    </header>

    <main id="app" class="main" tabindex="-1"></main>

    <nav class="tabbar" id="tabbar" aria-label="Alt menü"></nav>
  </div>

  <dialog id="formDialog" class="dialog">
    <form method="dialog" id="entityForm" class="dialog-form">
      <h2 id="dialogTitle" class="dialog-title"></h2>
      <div id="dialogFields" class="dialog-fields"></div>
      <div class="dialog-actions">
        <button type="submit" value="cancel" class="btn btn-ghost">Vazgeç</button>
        <button type="submit" value="save" class="btn btn-primary" id="dialogSave">Kaydet</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="js/app.js"></script>
</body>
</html>
